[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "finsight-agents"
version = "0.1.0"
description = "SEC filing retrieval and question-answering API."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "edgartools>=4.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.0",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sentence-transformers>=3.0",
    "tiktoken>=0.7",
    "torch>=2.2",
    "uvicorn[standard]>=0.30",
    "weaviate-client>=4,<5",
]

[tool.pytest.ini_options]
addopts = "-m 'not slow and not integration'"
markers = [
    "slow: requires downloading and loading the real sentence-transformers model",
    "integration: requires a running Weaviate service",
]

[tool.ruff.lint]
ignore = ["B008"]

[tool.hatch.build.targets.wheel]
packages = ["apps", "gateway", "memory"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
